name: Build School Manager

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows portable and installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Compile Python sources
        run: python -m compileall backend desktop_app.py pyinstaller_runtime_hook.py scripts

      - name: Build Windows portable
        run: pyinstaller SchoolManager.spec --noconfirm --clean

      - name: Check Windows portable for personal data
        run: python scripts/check_release_clean.py dist/SchoolManager

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Check Windows installer for personal data
        run: python scripts/check_release_clean.py dist/SchoolManager_Setup.exe

      - name: Compress Windows portable
        run: Compress-Archive -Path dist/SchoolManager -DestinationPath dist/SchoolManager-windows-portable.zip -Force

      - name: Check Windows portable zip for personal data
        run: python scripts/check_release_clean.py dist/SchoolManager-windows-portable.zip

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: SchoolManager-windows-portable
          path: dist/SchoolManager-windows-portable.zip

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SchoolManager-windows-installer
          path: dist/SchoolManager_Setup.exe

  build-macos:
    name: macOS app and dmg
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Compile Python sources
        run: python -m compileall backend desktop_app.py pyinstaller_runtime_hook.py scripts

      - name: Build macOS app
        run: pyinstaller SchoolManager.macos.spec --noconfirm --clean

      - name: Check macOS app for personal data
        run: python scripts/check_release_clean.py dist/SchoolManager.app

      - name: Prepare macOS app for distribution
        run: |
          xattr -cr dist/SchoolManager.app || true
          codesign --force --deep --sign - dist/SchoolManager.app

      - name: Create unsigned dmg
        run: |
          mkdir -p dist/dmg
          cp -R dist/SchoolManager.app dist/dmg/
          hdiutil create -volname "School Manager" -srcfolder dist/dmg -ov -format UDZO dist/SchoolManager-macOS-unsigned.dmg

      - name: Compress macOS app
        run: ditto -c -k --sequesterRsrc --keepParent dist/SchoolManager.app dist/SchoolManager-macOS-app-unsigned.zip

      - name: Check macOS app zip for personal data
        run: python scripts/check_release_clean.py dist/SchoolManager-macOS-app-unsigned.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: SchoolManager-macos-app-unsigned
          path: dist/SchoolManager-macOS-app-unsigned.zip

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: SchoolManager-macos-dmg-unsigned
          path: dist/SchoolManager-macOS-unsigned.dmg

  release:
    name: Publish GitHub release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show release assets
        run: find release-assets -type f -maxdepth 3 -print

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
